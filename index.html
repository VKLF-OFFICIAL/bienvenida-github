<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my GitHub</title>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #b026ff;
            --bg: #050505;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Luces de fondo animadas */
        .bg-animation {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #111 0%, #000 100%);
            z-index: -2;
        }
        .glow-circle {
            position: absolute;
            width: 350px; height: 350px;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            animation: float 8s infinite alternate ease-in-out;
            z-index: -1;
        }
        .glow-circle:nth-child(2) {
            background: var(--secondary);
            right: 15%; top: 15%;
            animation-delay: -4s;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            100% { transform: translateY(-40px) translateX(30px) scale(1.1); }
        }

        /* Tarjeta Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 4rem 5rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: fadeIn 1s ease-out;
            max-width: 90%;
            position: relative;
            overflow: hidden;
        }

        /* Efecto de borde superior */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .github-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 1.5rem;
            fill: #fff;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .card:hover .github-icon {
            transform: scale(1.1) translateY(-10px);
            fill: var(--primary);
            filter: drop-shadow(0 0 25px var(--primary));
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            background: linear-gradient(to right, #ffffff, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
            font-weight: 800;
        }

        p {
            font-size: 1.2rem;
            color: #888;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 0.6rem 2rem;
            border-radius: 50px;
            background: linear-gradient(90deg, rgba(0,255,204,0.05), rgba(176,38,255,0.05));
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            font-size: 0.85rem;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .badge:hover {
            border-color: var(--primary);
            color: #fff;
            background: rgba(0,255,204,0.1);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
    </style>
</head>
<body>
    <!-- Fondos animados -->
    <div class="bg-animation"></div>
    <div class="glow-circle" style="left: 10%; bottom: 10%;"></div>
    <div class="glow-circle"></div>

    <!-- Contenedor principal -->
    <div class="card">
        <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true">

        </svg>
        
        <h1>Welcome to my GitHub</h1>
        <p>Señor VK • vklf.es</p>
        
        <div class="badge">ASIR - Tarea 2.2 Redirección</div>
    </div>
</body>
</html>
